<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Остатки</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  background:#0f0f0f;
  color:#fff;
  font-family:system-ui;
  padding:16px;
}
.item {
  border-bottom:1px solid #333;
  padding:12px 0;
}
.row {
  display:flex;
  gap:8px;
  margin-top:6px;
}
input {
  flex:1;
  padding:8px;
  border-radius:6px;
  border:none;
}
.total {
  margin-top:6px;
  font-weight:bold;
}
.small {
  font-size:12px;
  color:#aaa;
}
button {
  width:100%;
  padding:14px;
  margin-top:16px;
  border:none;
  border-radius:10px;
  background:#2ecc71;
  font-size:16px;
  font-weight:600;
}
</style>
</head>

<body>

<div id="list"></div>

<button onclick="sendToBot()">Готово</button>

<script>
const tg = Telegram.WebApp;
tg.ready();
tg.expand();

// ⚠️ подставляется bar.json или kitchen.json
fetch('data.json')
  .then(r => r.json())
  .then(render);

function render(data) {
  const root = document.getElementById('list');

  data.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.name = item.name;
    div.dataset.multiplier = item.pack.multiplier;
    div.dataset.unit = item.base_unit;

    div.innerHTML = `
      <h3>${item.name}</h3>

      ${item.pack.multiplier > 0 ? `
      <div class="row">
        <input type="number" min="0" step="1"
          placeholder="${item.pack.label}">
      </div>` : ``}

      <div class="row">
        <input type="number" min="0" step="0.001"
          placeholder="Открыто / ${item.base_unit}">
      </div>

      <div class="total">
        ИТОГО: <span>0</span> ${item.base_unit}
      </div>

      <div class="small">
        ${item.pack.multiplier > 0
          ? `1 ${item.pack.label} = ${item.pack.multiplier} ${item.base_unit}`
          : ``}
      </div>
    `;

    div.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => update(div));
    });

    root.appendChild(div);
  });
}

function update(div) {
  const inputs = div.querySelectorAll('input');
  const k = Number(div.dataset.multiplier);

  let packs = 0;
  let open = 0;

  if (k > 0) {
    packs = Number(inputs[0].value) || 0;
    open  = Number(inputs[1].value) || 0;
  } else {
    open  = Number(inputs[0].value) || 0;
  }

  const total = packs * k + open;
  div.querySelector('span').textContent = total.toFixed(3);
}

function sendToBot() {
  const result = [];

  document.querySelectorAll('.item').forEach(div => {
    const qty = Number(div.querySelector('span').textContent);
    if (qty > 0) {
      result.push({
        name: div.dataset.name,
        qty: qty
      });
    }
  });

  tg.sendData(JSON.stringify(result));
  tg.close();
}
</script>

</body>
</html>
